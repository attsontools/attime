name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:plugin

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, label: macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, label: macos-x64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, label: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'),p='package.json',j=JSON.parse(fs.readFileSync(p));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs'),p='src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          perl -i -pe 'BEGIN{$c=0} if(/^version = /){ $c++; $_ = "version = \"'"$VERSION"'\"\n" if $c==1 }' src-tauri/Cargo.toml

      - name: Verify release version alignment
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/verify-release.mjs versions "${GITHUB_REF_NAME}"

      - run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build standalone application
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Build and verify plugin package
        env:
          ATTIME_PUBLISHER_KEY_ID: ${{ secrets.ATTIME_PUBLISHER_KEY_ID }}
          ATTIME_PUBLISHER_PRIVATE_KEY: ${{ secrets.ATTIME_PUBLISHER_PRIVATE_KEY }}
          ATTIME_PUBLISHER_PUBLIC_KEY: ${{ secrets.ATTIME_PUBLISHER_PUBLIC_KEY }}
        run: pnpm package:plugin

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          VERSION=$(node -p "require('./package.json').version")
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) OS=macos; ARCH=aarch64; EXT=dmg ;;
            x86_64-apple-darwin) OS=macos; ARCH=x86_64; EXT=dmg ;;
            aarch64-unknown-linux-gnu) OS=linux; ARCH=aarch64; EXT=deb ;;
            x86_64-unknown-linux-gnu) OS=linux; ARCH=x86_64; EXT=deb ;;
            x86_64-pc-windows-msvc) OS=windows; ARCH=x86_64; EXT=exe ;;
            *) echo "Unsupported release target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          PLUGIN="artifacts/AT.Time_${VERSION}_${OS}_${ARCH}.atpkg"
          test -f "$PLUGIN"
          INSTALLER_COUNT=$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name "*.${EXT}" | wc -l | tr -d ' ')
          if [ "$INSTALLER_COUNT" -ne 1 ]; then
            echo "Expected exactly one .${EXT} installer, found ${INSTALLER_COUNT}" >&2
            exit 1
          fi
          INSTALLER=$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name "*.${EXT}" | head -1)
          cp "$PLUGIN" "${RUNNER_TEMP}/stage/"
          cp "$INSTALLER" "${RUNNER_TEMP}/stage/AT.Time_${VERSION}_${OS}_${ARCH}.${EXT}"

      - uses: actions/upload-artifact@v4
        with:
          name: time-${{ matrix.label }}
          path: ${{ runner.temp }}/stage/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: time-*
          path: release-assets
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release asset set
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/verify-release.mjs assets release-assets "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
